blueprint:
  name: "Rollladen-Steuerung nach Sonnen-Azimut mit getrennter Zufallsverzögerung"
  description: "Steuert einen Rollladen basierend auf dem Azimut-Winkel der Sonne (sun.sun), einem Aktivierungs-Schalter sowie getrennten zufälligen Verzögerungen für Öffnen und Schließen (0 = sofort)."
  domain: automation
  input:
    target_cover:
      name: Rollladen
      description: Der zu steuernde Rollladen.
      selector:
        entity:
          domain: cover

    auto_enable_input:
      name: Automatik-Schalter
      description: Helfer (input_boolean), der bestimmt, ob das automatische Öffnen/Schließen aktiv ist.
      selector:
        entity:
          domain: input_boolean

    open_azimuth:
      name: Azimut zum Öffnen (Grad)
      description: Bei welchem Sonnen-Azimut (z. B. 90 für Osten) soll der Rollladen geöffnet werden?
      default: 90
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: "°"

    open_min_delay:
      name: Mindest-Verzögerung ÖFFNEN (Minuten)
      description: Minimale zufällige Wartezeit vor dem Öffnen (0 = sofort).
      default: 0
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: "min"

    open_max_delay:
      name: Maximale Verzögerung ÖFFNEN (Minuten)
      description: Maximale zufällige Wartezeit vor dem Öffnen (0 = sofort).
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: "min"

    close_azimuth:
      name: Azimut zum Schließen (Grad)
      description: Bei welchem Sonnen-Azimut (z. B. 270 für Westen) soll der Rollladen geschlossen werden?
      default: 270
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: "°"

    close_min_delay:
      name: Mindest-Verzögerung SCHLIESSEN (Minuten)
      description: Minimale zufällige Wartezeit vor dem Schließen (0 = sofort).
      default: 0
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: "min"

    close_max_delay:
      name: Maximale Verzögerung SCHLIESSEN (Minuten)
      description: Maximale zufällige Wartezeit vor dem Schließen (0 = sofort).
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: "min"

mode: restart

variables:
  var_open_min: !input open_min_delay
  var_open_max: !input open_max_delay
  var_close_min: !input close_min_delay
  var_close_max: !input close_max_delay

trigger:
  - platform: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: !input open_azimuth
    id: trigger_open

  - platform: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: !input close_azimuth
    id: trigger_close

condition:
  - condition: state
    entity_id: !input auto_enable_input
    state: "on"

action:
  - choose:
      - conditions:
          - condition: trigger
            id: trigger_open
        sequence:
          - if:
              - condition: template
                value_template: "{{ (var_open_max | int(0)) > 0 }}"
            then:
              - delay:
                  minutes: "{{ range(var_open_min | int(0), (var_open_max | int(0)) + 1) | random }}"
          - action: cover.open_cover
            target:
              entity_id: !input target_cover

      - conditions:
          - condition: trigger
            id: trigger_close
        sequence:
          - if:
              - condition: template
                value_template: "{{ (var_close_max | int(0)) > 0 }}"
            then:
              - delay:
                  minutes: "{{ range(var_close_min | int(0), (var_close_max | int(0)) + 1) | random }}"
          - action: cover.close_cover
            target:
              entity_id: !input target_cover
